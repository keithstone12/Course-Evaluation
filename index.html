<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css">
  <title>Instructor Evaluation</title>
</head>
<body>
  <h1>Instructor Evaluation</h1>
  <div id="form">
    <div class="question" data-id="1">
      <strong>1. Knowledge of subject matter</strong>
      <div class="rating">
        <input type="radio" id="q1_1" name="q1" value="1"><label for="q1_1">1</label>
        <input type="radio" id="q1_2" name="q1" value="2"><label for="q1_2">2</label>
        <input type="radio" id="q1_3" name="q1" value="3"><label for="q1_3">3</label>
        <input type="radio" id="q1_4" name="q1" value="4"><label for="q1_4">4</label>
        <input type="radio" id="q1_5" name="q1" value="5"><label for="q1_5">5</label>
      </div>
    </div>
    <div class="question" data-id="2">
      <strong>2. Clarity of instruction and communication</strong>
      <div class="rating">
        <input type="radio" id="q2_1" name="q2" value="1"><label for="q2_1">1</label>
        <input type="radio" id="q2_2" name="q2" value="2"><label for="q2_2">2</label>
        <input type="radio" id="q2_3" name="q2" value="3"><label for="q2_3">3</label>
        <input type="radio" id="q2_4" name="q2" value="4"><label for="q2_4">4</label>
        <input type="radio" id="q2_5" name="q2" value="5"><label for="q2_5">5</label>
      </div>
    </div>
  </div>
  <button onclick="calculateScore()">Calculate Score</button>
  <div id="totalScore">Average Score: --</div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
