<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007bff">
  <link rel="manifest" href="manifest.json">
  <title>Course and Instructor Evaluation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Course and Instructor Evaluation</h1>
  <form id="evaluationForm">
    <section>
      <h2>Instructor Evaluation</h2>
      <label>Knowledge of subject matter:
        <select name="q1">
          <option value="">Select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label>Clarity of instruction and communication:
        <select name="q2">
          <option value="">Select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
    </section>
    <section>
      <h2>Course Evaluation</h2>
      <label>Relevance of course content to job skills:
        <select name="q3">
          <option value="">Select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label>Clarity of course objectives:
        <select name="q4">
          <option value="">Select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
    </section>
    <label>Additional Comments:
      <textarea name="comments" rows="5"></textarea>
    </label>
    <p id="averageScore">Average Score: --</p>
    <button type="submit">Submit Evaluation</button>
  </form>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
